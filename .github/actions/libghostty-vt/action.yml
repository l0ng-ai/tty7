# One reusable step: the libghostty-vt static archive for one target,
# built from the pinned Ghostty tag with the pinned Zig — or restored from
# the cache, because a clean Zig build of Ghostty's terminal core is
# minutes no CI job should pay on every push.
#
# Usage (before any cargo step that builds tty59 / tty59-cli /
# tty59-gateway — tty59-server and the musl server never need it, they
# don't depend on tty59-vt):
#
#   - uses: ./.github/actions/libghostty-vt
#     with:
#       target: ${{ matrix.target }}
#
# Exports `TTY59_GHOSTTY_DIR` to the job's environment (that is what
# tty59-vt-sys's build.rs links against) and sets the `prefix` output.
#
# The cache key carries everything that changes the archive's bytes: the
# Ghostty tag, the Zig version, the target, and the build flags. Bump any
# of them and the archives rebuild once.
#
# Targets and their runners:
#   x86_64-unknown-linux-gnu   ubuntu-latest     (native)
#   aarch64-unknown-linux-gnu  ubuntu-latest     (cross — zig does this)
#   aarch64-apple-darwin       macos-14 (arm)    (native)
#   x86_64-apple-darwin        macos-14 (arm)    (cross — zig's ld64)
#   x86_64-pc-windows-msvc     windows-latest    (native; zig auto-detects
#                                                 MSVC + the Windows SDK —
#                                                 this is why Windows msvc
#                                                 archives cannot be built
#                                                 from a Linux runner, the
#                                                 C dependencies want the
#                                                 SDK headers)
#   aarch64-pc-windows-msvc    windows-latest    (cross from x64 — same SDK)
name: libghostty-vt
description: Build or restore the libghostty-vt archive for one target
inputs:
  target:
    description: Rust target triple (mapped to a Zig target inside)
    required: true
  ghostty-version:
    description: Pinned Ghostty tag (mise.toml's vt:fetch pins the same)
    default: v1.4.0
  zig-version:
    description: Zig that builds it (tty59-vt-sys/mise.toml pins the same)
    default: 0.17.0
  flags:
    description: The build flags (part of the cache key)
    default: ReleaseFast-baseline

outputs:
  prefix:
    description: The prefix holding lib/ + include/ for this target
    value: ${{ steps.prefix.outputs.prefix }}

runs:
  using: composite
  steps:
    - id: prefix
      shell: bash
      run: echo "prefix=$RUNNER_TEMP/libghostty-vt/${{ inputs.target }}" >> "$GITHUB_OUTPUT"

    - name: Map the target to Zig's spelling
      id: zig-target
      shell: bash
      run: |
        case "${{ inputs.target }}" in
          x86_64-unknown-linux-gnu)  ZT=x86_64-linux-gnu ;;
          aarch64-unknown-linux-gnu) ZT=aarch64-linux-gnu ;;
          aarch64-apple-darwin)      ZT=aarch64-macos ;;
          x86_64-apple-darwin)       ZT=x86_64-macos ;;
          x86_64-pc-windows-msvc)    ZT=x86_64-windows-msvc ;;
          aarch64-pc-windows-msvc)   ZT=aarch64-windows-msvc ;;
          *) echo "no Zig target mapping for ${{ inputs.target }}" >&2; exit 1 ;;
        esac
        echo "zt=$ZT" >> "$GITHUB_OUTPUT"

    - name: Restore the cached archive
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.prefix.outputs.prefix }}
        key: libghostty-vt-${{ inputs.ghostty-version }}-zig${{ inputs.zig-version }}-${{ inputs.target }}-${{ inputs.flags }}

    # Zig 0.17.0 — deliberately NOT the 0.16 that `cargo zigbuild` uses
    # elsewhere in CI: Ghostty v1.4.0's build requires 0.17, and the two
    # coexist as separate toolchain installs without stepping on each
    # other.
    #
    # Installed by a pinned direct download with a checksum rather than a
    # setup action: the tarball naming flipped to arch-first (and Windows
    # became a .zip) around 0.14/0.15, and `mlugg/setup-zig` still builds
    # the old os-first URLs — every 0.17.0 fetch 404s (CI run 40954581613).
    # The names and sums below come from ziglang.org's download index for
    # 0.17.0; bump the version by refreshing them from that index.
    - name: Install Zig (pinned, checksummed)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.zig-version }}
      run: |
        set -euo pipefail
        # The Zig that RUNS matches the runner's platform; it cross-builds
        # the -Dtarget above.
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)    ZP=x86_64-linux ;;
          Linux-ARM64)  ZP=aarch64-linux ;;
          macOS-X64)    ZP=x86_64-macos ;;
          macOS-ARM64)  ZP=aarch64-macos ;;
          Windows-X64)  ZP=x86_64-windows ;;
          Windows-ARM64) ZP=aarch64-windows ;;
          *) echo "no Zig toolchain for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
        esac
        case "$ZP" in
          *-windows) EXT=zip ;;
          *)         EXT=tar.xz ;;
        esac
        case "$ZP-$ZIG_VERSION" in
          # sha256s from https://ziglang.org/download/index.json
          x86_64-linux-0.17.0)    SUM=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
          aarch64-linux-0.17.0)   SUM=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
          x86_64-macos-0.17.0)    SUM=4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6 ;;
          aarch64-macos-0.17.0)   SUM=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a ;;
          x86_64-windows-0.17.0)  SUM=b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428 ;;
          aarch64-windows-0.17.0) SUM=0a59d91fa1cb40cf068e9b0954434ce973500c7a2ea749f1e01af62cdab52d26 ;;
          *) echo "no pinned sha256 for zig $ZIG_VERSION on $ZP — refresh the table from ziglang.org's download index" >&2; exit 1 ;;
        esac
        url="https://ziglang.org/download/$ZIG_VERSION/zig-$ZP-$ZIG_VERSION.$EXT"
        echo "fetching $url"
        curl -fsSL -o "$RUNNER_TEMP/zig.$EXT" "$url"
        # `sha256sum` everywhere GitHub runners have it; macOS ships
        # `shasum` instead.
        got=$(sha256sum "$RUNNER_TEMP/zig.$EXT" 2>/dev/null | cut -d' ' -f1 \
              || shasum -a 256 "$RUNNER_TEMP/zig.$EXT" | cut -d' ' -f1)
        if [ "$got" != "$SUM" ]; then
          echo "::error::zig download checksum mismatch: got $got want $SUM" >&2
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/zig-toolchain"
        if [ "$EXT" = zip ]; then
          unzip -q "$RUNNER_TEMP/zig.$EXT" -d "$RUNNER_TEMP/zig-toolchain"
        else
          tar -xJf "$RUNNER_TEMP/zig.$EXT" -C "$RUNNER_TEMP/zig-toolchain"
        fi
        bindir=$(echo "$RUNNER_TEMP"/zig-toolchain/zig-* | head -1)
        echo "$bindir" >> "$GITHUB_PATH"
        "$bindir/zig" version

    - name: Fetch Ghostty
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --depth 1 --branch ${{ inputs.ghostty-version }} \
          https://github.com/ghostty-org/ghostty.git "$RUNNER_TEMP/ghostty-src"

    # The same invocation mise's `vt:build` uses locally: ReleaseFast,
    # baseline CPU so the archive runs on the oldest hardware each target
    # ships to, installed into a prefix with lib/ + include/ — exactly the
    # shape tty59-vt-sys's build.rs links and bindgen reads.
    - name: Build the archive
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "$RUNNER_TEMP/ghostty-src"
        zig build -Demit-lib-vt -Doptimize=ReleaseFast -Dcpu=baseline \
          -Dtarget=${{ steps.zig-target.outputs.zt }} \
          -p "${{ steps.prefix.outputs.prefix }}"

    - name: Assert the archive is where build.rs looks
      shell: bash
      run: |
        if [ "${{ runner.os }}" = Windows ]; then
          f="${{ steps.prefix.outputs.prefix }}/lib/ghostty-vt-static.lib"
        else
          f="${{ steps.prefix.outputs.prefix }}/lib/libghostty-vt.a"
        fi
        test -f "$f" || { echo "missing $f" >&2; exit 1; }

    - name: Export TTY59_GHOSTTY_DIR
      shell: bash
      run: echo "TTY59_GHOSTTY_DIR=${{ steps.prefix.outputs.prefix }}" >> "$GITHUB_ENV"
