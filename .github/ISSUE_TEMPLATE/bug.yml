name: Bug report
description: Something in tty59 doesn't work as expected
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest tty59 release, or I've said below why I can't be.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: The behaviour you saw, in a sentence or two.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Numbered steps starting from a freshly opened tty59 window. If a
        specific command or escape sequence triggers it, paste the exact one —
        "some TUI app" is rarely enough to reproduce a terminal bug.
      placeholder: |
        1. Open a new tab
        2. Run `printf '\e[?2004h'`
        3. Type a character — the pane freezes
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tty59 version
      description: Run `tty59 --version`, or check the About window.
      placeholder: "26.9.2"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: Shell and TUI app involved
      description: >
        The shell you were running, and the TUI app plus its version if one is
        on screen when it happens.
      placeholder: fish 3.7.1, neovim 0.10.2

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >
        tty59 only writes a log when `TTY59_LOG` is set (e.g. `TTY59_LOG=debug`),
        so there is none by default: set it, quit tty59 completely, reproduce,
        then paste the tail of `~/.config/tty59/tty59.log`
        (`%APPDATA%\tty59\tty59.log` on Windows). After a crash, include
        `crash.log` from the same folder — that one is always written. This is
        rendered as code, so no backticks needed.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a recording, or anything else worth knowing.
