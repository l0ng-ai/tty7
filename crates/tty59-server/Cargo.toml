[package]
name = "tty59-server"
version.workspace = true
edition.workspace = true
description = "tty59's headless session server: the persistent terminal daemon, with no GUI attached"
repository = "https://github.com/nathabonfim59/tty59"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tty59-server"
path = "src/main.rs"

# One dependency, on purpose. This binary exists to prove — and keep proving —
# that everything a tty59 session needs runs without gpui: if it ever grows a
# second dependency that the GUI also needs, that dependency belongs in
# `tty59-core` instead.
[dependencies]
tty59-core = { path = "../tty59-core" }

# The end-to-end proof (`tests/stdio_conformance.rs`) runs `tty59-core`'s shared
# `Host` conformance suite against a *real* `tty59-server --stdio` child process.
# It has to live in this crate because that is the crate that owns the binary —
# `CARGO_BIN_EXE_tty59-server` only exists for its own tests.
[dev-dependencies]
# Sandboxes for the suite: an empty directory per case, removed on drop. The
# server is on this machine, so a local temp dir is a path in its namespace.
tempfile = "3"
# `tests/daemon_stop.rs` probes and, on failure, kills the daemon it spawned;
# a pid needs `kill(2)`, which `Child` cannot express once ownership has moved
# to the thread collecting the exit.
libc = "0.2"
[lints]
workspace = true
