[package]
name = "tty59-gateway"
version.workspace = true
edition.workspace = true
description = "tty59's mobile gateway: lets a paired phone watch and drive this machine's panes over iroh"
repository = "https://github.com/nathabonfim59/tty59"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tty59-gateway"
path = "src/main.rs"

[dependencies]
# `remote-install` for its proxy resolution, which the relay dial shares with
# tty59's downloads.
tty59-core = { path = "../tty59-core", features = ["remote-install"] }
tty59-mobile-proto = { path = "../tty59-mobile-proto", features = ["tokio"] }

anyhow.workspace = true
log.workspace = true
serde = { workspace = true }
serde_json.workspace = true

clap = { version = "4", features = ["derive"] }
# Dials by public key, punches through NATs, and falls back to a relay when it
# cannot — so a phone on cellular reaches a laptop behind a home router with no
# port forwarding and no VPN, end-to-end encrypted either way.
iroh = "1.2"
# Lets a phone on the same network find the gateway by its key when the
# addresses in its pairing code have gone stale — a new DHCP lease, a new IPv6
# prefix — with no relay reachable to ask instead.
iroh-mdns-address-lookup = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
getrandom = "0.3"
# iroh takes its proxy as a `Url`.
url = "2"
# Reads a pane's output the way the desktop's window does, so a phone is sent
# the screen the desktop shows rather than bytes its own emulator re-wraps:
# the VT seam (model types + facade) over the same engine the desktop's
# window parses with (docs/libghostty-migration.md). No engine type is
# named in the gateway — the seam is the point.
tty59-vt = { path = "../tty59-vt" }
# Draws the pairing code as a QR code right in the terminal.
qrcode = { version = "0.14", default-features = false }

# Hashes the OS's machine id into the fingerprint a pairing code carries
# (`identity`), so the id itself never leaves the machine.
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The computer's name as System Settings shows it (`identity::name`). 0.6, as
# tty59-core pins, and its own core-foundation re-export to match.
[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.6"

# MachineGuid, the machine id the fingerprint is made from on Windows.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
tty59-mobile-client = { path = "../tty59-mobile-client" }

[lints]
workspace = true
