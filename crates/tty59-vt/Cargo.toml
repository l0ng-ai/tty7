# The VT seam (docs/libghostty-migration.md): tty59's own model types plus
# the libghostty-vt facade. Ghostty is the only engine (Phase 6b); the
# archive it links is built from the pinned Ghostty tag with
# `mise run vt:build` (see the root mise.toml and build.rs in
# tty59-vt-sys).
[package]
name = "tty59-vt"
version.workspace = true
edition.workspace = true
description = "tty59's engine-neutral VT seam: model types and the libghostty-vt facade"
repository = "https://github.com/nathabonfim59/tty59"
license = "Apache-2.0"
publish = false

[dependencies]
# Bitflags for the model's `CellFlags`/`Modes`.
bitflags = "2"
# What the seam's FairMutex (src/sync.rs) locks — the same parking_lot the
# replaced engine used, so its lock semantics carried over exactly. The
# implementation is a copy of alacritty's sync.rs; its notice ships with
# the packages (assets/licenses/).
parking_lot = "0.12.0"
# Inline storage for a cell's combining marks: the frame path fills one of
# these per cell per paint, and a grapheme cluster longer than two
# codepoints is the rare case that can afford the heap.
smallvec.workspace = true
# SIMD byte scan for the ED2 rewriter (one memchr per chunk on the
# plain-text hot path).
memchr = "2"
# The clear_row_wrap guard logs the rows it leaves alone.
log.workspace = true
# Raw libghostty-vt bindings: build.rs links the static archive and says
# how to get it when TTY59_GHOSTTY_DIR is missing.
tty59-vt-sys = { path = "../tty59-vt-sys" }
# The backend's text matcher for regex and case-sensitive queries
# (decision 6).
# `unicode-case` is load-bearing: the matcher builds its queries
# case-insensitively, and without it `RegexBuilder::case_insensitive`
# fails to compile valid patterns (masked for most of the migration by
# workspace feature unification with the root's fuller regex feature set).
regex = { version = "1", default-features = false, features = [
  "std",
  "perf",
  "unicode-perl",
  "unicode-case",
] }

[lints]
workspace = true
