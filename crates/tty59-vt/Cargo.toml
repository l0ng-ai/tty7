# The VT seam (docs/libghostty-migration.md): tty59's own model types plus a
# facade over whichever engine is compiled in.
#
# The default build is the alacritty backend — plain Rust, no FFI, what
# every consumer runs today — so bare `cargo build` never needs Ghostty's
# native archive. The `ghostty` feature alone pulls in `tty59-vt-sys` (and
# the C library it links); tty59-cli's `vt-ghostty` turns it on.
[package]
name = "tty59-vt"
version.workspace = true
edition.workspace = true
description = "tty59's engine-neutral VT seam: model types, facades, and the libghostty-vt wrapper behind a feature"
repository = "https://github.com/nathabonfim59/tty59"
license = "Apache-2.0"
publish = false

[features]
default = []
# The Ghostty backend: `tty59_vt::Terminal` and the FFI it lives behind.
ghostty = ["dep:tty59-vt-sys"]

[dependencies]
# The default backend. Same workspace pin the GUI and tty59-cli build with,
# so all three agree on the fork's patches (see the root Cargo.toml).
alacritty_terminal.workspace = true
# Bitflags for the model's `CellFlags`/`Modes`. Already in the tree via
# alacritty_terminal, so this pins no new code.
bitflags = "2"
# What the seam's FairMutex (src/sync.rs) locks — the same parking_lot the
# engine being replaced uses, so its lock semantics are carried over
# exactly, and no new code enters the tree.
parking_lot = "0.12.0"
# Inline storage for a cell's combining marks: the frame path fills one of
# these per cell per paint, and a grapheme cluster longer than two
# codepoints is the rare case that can afford the heap.
smallvec.workspace = true
# Raw libghostty-vt bindings, only when the Ghostty backend is asked for —
# its build.rs links the static archive, which contributors and CI don't
# have (see docs/libghostty-migration.md, decision 2).
tty59-vt-sys = { path = "../tty59-vt-sys", optional = true }

[lints]
workspace = true
