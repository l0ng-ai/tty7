[package]
name = "tty59-mobile-client"
version.workspace = true
edition.workspace = true
description = "The phone side of the tty59 mobile link: pair with a gateway, list its panes, watch and type into them"
repository = "https://github.com/nathabonfim59/tty59"
license = "Apache-2.0"
publish = false

# What the mobile app's Rust half links, so like tty59-mobile-proto it stays off
# tty59-core: this has to cross-compile for iOS and Android.
[dependencies]
tty59-mobile-proto = { path = "../tty59-mobile-proto", features = ["tokio"] }

anyhow.workspace = true
serde = { workspace = true }
iroh = "1.2"
# Finds a paired gateway on the local network after its addresses change.
iroh-mdns-address-lookup = "0.5"
tokio = { version = "1", features = ["sync", "time", "io-util"] }

[dev-dependencies]
serde_json.workspace = true
tty59-mobile-proto = { path = "../tty59-mobile-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
