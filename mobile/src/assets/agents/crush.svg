<!-- Crush's pixel heart, from charmbracelet/crush (MIT). The source mark is
     the 512x512 notification icon; its silhouette is traced to a 24x20 grid,
     centred in tty59's 24x24 icon format. The avatars tint the whole mark flat,
     so the source's magenta-on-violet shading collapses to one sentinel fill. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<g fill="#FF0000">
<rect x="3" y="2" width="7" height="1"/>
<rect x="14" y="2" width="7" height="1"/>
<rect x="2" y="3" width="9" height="1"/>
<rect x="13" y="3" width="9" height="1"/>
<rect x="2" y="4" width="9" height="1"/>
<rect x="13" y="4" width="9" height="1"/>
<rect x="0" y="5" width="24" height="1"/>
<rect x="0" y="6" width="24" height="1"/>
<rect x="0" y="7" width="24" height="1"/>
<rect x="0" y="8" width="24" height="1"/>
<rect x="0" y="9" width="24" height="1"/>
<rect x="0" y="10" width="24" height="1"/>
<rect x="0" y="11" width="24" height="1"/>
<rect x="0" y="12" width="24" height="1"/>
<rect x="0" y="13" width="24" height="1"/>
<rect x="2" y="14" width="20" height="1"/>
<rect x="2" y="15" width="20" height="1"/>
<rect x="2" y="16" width="20" height="1"/>
