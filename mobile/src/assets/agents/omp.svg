<!-- Oh My Pi's own brand mark, from https://omp.sh/favicon.svg.
     Normalized to tty7's 24x24 icon format: the source is a 64x64 box whose
     art spans x[14,50] y[16,56], scaled by 0.6 so the height fills the box and
     centred horizontally; every edge lands on a tenth of a unit and the
     proportions are unchanged. The source paints the glyph with a
     pink-violet-cyan gradient on a near-black rounded square; the avatars are
     tinted flat by the app and draw their own field, so the square is dropped
     and the gradient collapses to the single sentinel fill the rest of the set
     uses. The field and mark colours live in cli_agent.rs. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="1.2" y="0" width="21.6" height="4.8" fill="#FF0000"/>
<rect x="3.6" y="4.8" width="4.8" height="13.2" fill="#FF0000"/>
<rect x="12" y="4.8" width="4.8" height="19.2" fill="#FF0000"/>
</svg>
